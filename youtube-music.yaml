            const upNext = tabs[0]?.tabRenderer?.content?.musicQueueRenderer?.content?.playlistPanelRenderer;
            panelContents = upNext?.contents || [];
            continuations = upNext?.continuations;
          }
          const nextData = continuations?.[0]?.nextRadioContinuationData || continuations?.[0]?.nextContinuationData;
          if (nextData?.continuation) nextContinuation = nextData.continuation;

          for (const item of panelContents) {
            const r = item.playlistPanelVideoRenderer;
            if (!r || !r.videoId) continue;
