              if (headerText === 'Videos') {
                const moreBtn = carousel.header?.musicCarouselShelfBasicHeaderRenderer?.moreContentButton?.buttonRenderer?.navigationEndpoint?.browseEndpoint;
                if (moreBtn) { videosBrowseId = moreBtn.browseId; if (moreBtn.params) videosParams = moreBtn.params; }
                break;
              }
            }
          }
        } catch (e) {}
        if (!videosBrowseId) { postResult({ items: [] }); }
        else {
          const resp = await fetch(url, {
            method: 'POST', headers: headers,
            body: JSON.stringify({ context: { client: { clientName: 'WEB_REMIX', clientVersion: clientVersion } }, browseId: videosBrowseId, params: videosParams })
          });
          videosData = await resp.json();
        }
      }

      if (videosData) {
        const result = extractVideos(videosData);
        const output = { items: result.items };
        if (result.continuation) output.continuation = result.continuation;
        postResult(output);
      }
    artistAlbums: |
