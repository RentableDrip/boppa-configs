  list:
    album: |
      const clientId = params.context.SOUNDCLOUD_CLIENT_ID;
      function upgradeArtwork(url) {
        if (!url) return url;
        return url.replace(/-large(\.[a-zA-Z]+)$/, '-t1080x1080$1');
      }
      const pageSize = 10;
      const offset = params.previousResult?.nextOffset || 0;
      let trackIds = params.previousResult?.trackIds;

      if (!trackIds) {
        const albumResp = await fetch('https://api-v2.soundcloud.com/playlists/' + params.id + '?client_id=' + clientId);
        const albumData = await albumResp.json();
        trackIds = (albumData.tracks || []).map(t => t.id);
      }

      const pageIds = trackIds.slice(offset, offset + pageSize);

      if (pageIds.length === 0) {
        postResult({ items: [] });
      } else {
        const resp = await fetch('https://api-v2.soundcloud.com/tracks?ids=' + pageIds.join('%2C') + '&client_id=' + clientId);
        const data = await resp.json();
        const trackMap = {};
        if (Array.isArray(data)) { for (const t of data) { trackMap[t.id] = t; } }
        const items = pageIds.map(id => {
          const t = trackMap[id];
          if (!t || t.policy === 'SNIP') return null;
          const tc = t.media?.transcodings?.filter(x => !x.format?.protocol?.includes('encrypted'));
          const streamUrl = (
            tc?.find(x => x.preset === 'aac_160k')
            || tc?.find(x => x.preset === 'mp3_1_0' && x.format?.protocol === 'hls')
            || tc?.find(x => x.preset === 'mp3_1_0' && x.format?.protocol === 'progressive')
