            || tc?.find(x => x.preset === 'opus_0_0')
            || tc?.[0]
          )?.url || null;
          return {
            id: t.id, title: t.title, subtitle: t.user?.username,
            artists: t.user?.username ? [{ id: t.user.id, name: t.user.username }] : [],
            duration: t.duration,
            lowResArtworkUrl: t.artwork_url || t.user?.avatar_url,
            highResArtworkUrl: upgradeArtwork(t.artwork_url || t.user?.avatar_url),
            url: t.permalink_url,
            metadata: { streamRequestUrl: streamUrl || null }
          };
        }).filter(Boolean);
        const nextOffset = offset + pageSize;
        const output = { items: items };
        if (nextOffset < trackIds.length) { output.nextOffset = nextOffset; output.trackIds = trackIds; }
        postResult(output);
      }
